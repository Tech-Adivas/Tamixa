<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tamixa — Decision journal (printable)</title>
  <style>
    :root { --ink: #142132; --muted: #5a6b7a; --line: #c8d4e0; }
    body { font-family: Georgia, "Times New Roman", serif; color: var(--ink); max-width: 720px; margin: 2rem auto; padding: 0 1.25rem; line-height: 1.45; }
    h1 { font-size: 1.35rem; font-weight: 600; margin-bottom: 0.25rem; }
    p.sub { color: var(--muted); font-size: 0.95rem; margin-top: 0; }
    section { margin-top: 1.75rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    .lines { min-height: 6.5rem; border: 1px dashed var(--line); border-radius: 6px; padding: 0.75rem; }
    @media print { body { margin: 0.5in; } a { color: inherit; text-decoration: none; } }
  </style>
</head>
<body>
  <h1>Decision journal</h1>
  <p class="sub">After a Tamixa safety or life-skills story: one real-world reflection—not a grade. Parent and child can fill this together.</p>

  <section>
    <label>What happened in the story?</label>
    <div class="lines"></div>
  </section>
  <section>
    <label>What would you do in a similar situation?</label>
    <div class="lines"></div>
  </section>
  <section>
    <label>One small thing to watch for this week</label>
    <div class="lines"></div>
  </section>
  <section>
    <label>Who could you ask if unsure? (trusted adult / bank / app)</label>
    <div class="lines"></div>
  </section>

  <p class="sub" style="margin-top:2rem;">Print from the browser if you want a paper copy.</p>
</body>
</html>
