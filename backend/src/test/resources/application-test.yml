# Test profile: datasource URL is set via @DynamicPropertySource from Testcontainers.
# Redis and Kafka are excluded so context loads with only Postgres (Testcontainers).
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  jpa:
    hibernate:
      # `create-drop` runs a large delayed DROP on SessionFactory shutdown; with Testcontainers the DB
      # connection often dies first (EOF / broken connection), flooding logs with HHH000478. `create`
      # still rebuilds schema on startup without teardown DDL.
      ddl-auto: create
    show-sql: false  # Use org.hibernate.SQL logger; set LOG_LEVEL_HIBERNATE_SQL=DEBUG for SQL in tests

# Rate limit: low for tests so we can hit 429 quickly
app:
  control-plane:
    # Integration tests use Hibernate `create` schema without V76 seed; keep story runs off unless a test seeds workflows.
    story-workflow-integration-enabled: false
  cors:
    # Explicit origins for tests (non-dev profiles need origins and/or allowed-origin-patterns)
    allowed-origins: http://localhost:8080,http://localhost:3000
  rate-limit:
    requests-per-minute: 2

# Override readiness: Redis excluded above, so don't require it in health group
management:
  endpoint:
    health:
      group:
        readiness:
          include: db,diskSpace
  health:
    redis:
      enabled: false

logging:
  level:
    root: INFO
    com.tamixa: DEBUG
    org.hibernate.SQL: WARN
