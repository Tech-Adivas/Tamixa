spring:
  application:
    name: tamixa
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    # Enable by default for local/dev. In staging/prod, override to false on app nodes
    # and run migrations in a dedicated release job with FLYWAY_ENABLED=true.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Wait longer for lock hand-off instead of failing during rolling starts.
    lock-retry-count: ${FLYWAY_LOCK_RETRY_COUNT:300}
    # Handle DB startup races gracefully.
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:5}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Railway Redis and most managed Redis require a password; leave empty for local no-auth Redis.
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false  # Only RedisTemplate used; no Spring Data Redis repos
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Datasource URL per profile: dev/staging/prod set spring.datasource.url via DATABASE_URL or POSTGRES_* / PG* chain.
  # PostgresqlUrlEnvironmentPostProcessor promotes DATABASE_PUBLIC_URL (postgresql://) when DATABASE_URL is unset.
  datasource:
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      # Below max so the pool can shrink; otherwise Hikari is "fixed size" and idle-timeout is ignored (WARN at startup).
      minimum-idle: ${HIKARI_MINIMUM_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      keepalive-time: 30000

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

# Actuator: health groups, metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: ping
        readiness:
          # Redis optional in dev; prod profile adds redis when Redis is required for scaling.
          include: db,diskSpace
  health:
    redis:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      # Enable histogram buckets for admin story update timer so Prometheus can compute p95/p99.
      percentiles-histogram:
        admin_story_update_latency: true
      # SLO buckets (seconds): 0.25s, 0.5s, 1s, 2s, 5s, 10s, 20s, 60s, 120s.
      slo:
        admin_story_update_latency: 250ms,500ms,1s,2s,5s,10s,20s,60s,120s

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.tamixa: ${LOG_LEVEL_COM_TAMIXA:DEBUG}
    org.springframework.security: INFO
    # Suppress Broken pipe / Connection reset WARN when client disconnects during cover/stream response
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: ERROR
    # Hibernate SQL: WARN suppresses SELECT/INSERT/UPDATE logs; WARN+ still shows connection errors, constraint violations.
    # Set LOG_LEVEL_HIBERNATE_SQL=DEBUG to enable SQL debugging.
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Resilience4j circuit breaker for OpenAI, Gemini, and TTS (fail fast when downstream is failing)
resilience4j:
  circuitbreaker:
    instances:
      openai:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      gemini:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      tts:
        register-health-indicator: true
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 5

app:
  auth:
    # Dev-only: dummy OTP code accepted with any phone (e.g. 123456). Set in dev profile.
    dev-otp-code: ${DEV_OTP_CODE:}
    # Web app base URL for passwordless magic links (e.g. http://localhost:3000 or your production Tamixa URL).
    web-base-url: ${TAMIXA_WEB_APP_URL:http://localhost:3000}
    # Dev only: fixed code accepted for web passwordless (e.g. 123456). Set in dev profile; leave empty in prod.
    dev-passwordless-code: ${DEV_PASSWORDLESS_CODE:}
  # Strangler: POST magic-link email to tamixa-notifications (internal API). When true, backend skips in-process SendGrid for passwordless.
  notifications-email:
    remote-enabled: ${NOTIFICATIONS_EMAIL_REMOTE_ENABLED:false}
    base-url: ${NOTIFICATIONS_EMAIL_BASE_URL:}
    internal-api-key: ${NOTIFICATIONS_INTERNAL_API_KEY:}
  cors:
    # Comma-separated exact origins. "*" = unset for non-dev unless allowed-origin-patterns is set (see profile YAML).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    # Comma-separated origin patterns (optional). Staging/dev profiles set defaults; prod should use explicit origins.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Set true for multi-instance: uses Redis. Requires Redis. Default false.
    use-redis: ${RATE_LIMIT_USE_REDIS:false}
    # When false, Redis errors during limit checks return 503 (prod recommended with use-redis=true).
    redis-fail-open: ${RATE_LIMIT_REDIS_FAIL_OPEN:true}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
    # Admin dashboard: higher limit per IP (no full bypass) to prevent abuse if admin JWT is compromised.
    admin-requests-per-minute: ${RATE_LIMIT_ADMIN_REQUESTS_PER_MINUTE:200}
    # /auth/me + /auth/refresh: separate from general so token refresh is not starved (avoids false "session expired").
    session-requests-per-minute: ${RATE_LIMIT_SESSION_REQUESTS_PER_MINUTE:300}
    story-generation-free-per-hour: ${STORY_RATE_LIMIT_FREE:10}
    story-generation-paid-per-hour: ${STORY_RATE_LIMIT_PAID:60}
    story-generation-suspicious-per-hour: ${STORY_RATE_LIMIT_SUSPICIOUS:2}
  jwt:
    secret: ${JWT_SECRET:tamixa-secret-key-min-256-bits-for-hs256-algorithm-please-change-in-production}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  # OpenAI: token limit controls cost; system prompt is reused for caching (provider-supported).
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    max-tokens: ${OPENAI_MAX_TOKENS:1024}
    connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:15000}
    # Regenerate with prompt generates ~900-word stories; 3 min allows full response (60s can timeout)
    read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:180000}
    # When true, missing OPENAI_API_KEY causes moderation to fail closed (reject). Default false for local dev.
    moderation-required: ${OPENAI_MODERATION_REQUIRED:false}
    retry:
      max-attempts: ${OPENAI_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${OPENAI_RETRY_INITIAL_MS:1000}
      multiplier: ${OPENAI_RETRY_MULTIPLIER:2.0}
  # Primary LLM: openai (default) or gemini. Story generation, moderation, and pipeline rewrite follow this switch.
  llm:
    provider: ${AI_LLM_PROVIDER:openai}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:15000}
      read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:180000}
      moderation-required: ${GEMINI_MODERATION_REQUIRED:false}
  # Still cover image: openai (DALL·E 3, default) or gemini (Gemini native image; same GEMINI_API_KEY as Veo/LLM when gemini).
  image-generation:
    provider: ${AI_COVER_IMAGE_PROVIDER:openai}
    gemini:
      model: ${AI_COVER_IMAGE_GEMINI_MODEL:gemini-2.5-flash-image}
      aspect-ratio: ${AI_COVER_IMAGE_GEMINI_ASPECT_RATIO:1:1}
      image-size: ${AI_COVER_IMAGE_GEMINI_IMAGE_SIZE:1K}
      use-image-config: ${AI_COVER_IMAGE_GEMINI_USE_IMAGE_CONFIG:true}
  # Cover animation: still cover + optional Veo 3.1 Lite (image→short MP4) + FFmpeg→GIF. Veo uses GEMINI_API_KEY.
  cover-animation:
    convert-mp4-to-gif: ${COVER_ANIMATION_FFMPEG_MP4_TO_GIF:true}
    veo:
      enabled: ${COVER_ANIMATION_VEO_ENABLED:false}
      base-url: ${COVER_ANIMATION_VEO_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${COVER_ANIMATION_VEO_MODEL:veo-3.1-lite-generate-preview}
      # 4 | 6 | 8 seconds (4 = lowest cost on Veo Lite)
      duration-seconds: ${COVER_ANIMATION_VEO_DURATION_SECONDS:4}
      resolution: ${COVER_ANIMATION_VEO_RESOLUTION:720p}
      aspect-ratio: ${COVER_ANIMATION_VEO_ASPECT_RATIO:16:9}
      # Image-to-video: Google requires allow_adult on this path
      person-generation: ${COVER_ANIMATION_VEO_PERSON_GENERATION:allow_adult}
      poll-interval-sec: ${COVER_ANIMATION_VEO_POLL_INTERVAL_SEC:10}
      max-wait-sec: ${COVER_ANIMATION_VEO_MAX_WAIT_SEC:360}
  story:
    cache-ttl-hours: ${STORY_CACHE_TTL_HOURS:24}
    # Max words for generated stories and for curated pipeline translation + rewrite (prompts + hard clamp).
    max-words: ${STORY_MAX_WORDS:900}
    # Safety: theme allowlist (empty = allow any; comma-separated for restrict mode)
    theme-allowlist: ${STORY_THEME_ALLOWLIST:}
    # Story safety score threshold (0-100). Reject if score < threshold.
    safety-score-threshold: ${STORY_SAFETY_SCORE_THRESHOLD:60}
    # Custom keyword blocklist for moderation layer 2 (comma-separated)
    keyword-blocklist: ${STORY_KEYWORD_BLOCKLIST:}
    # When true, generated stories require admin approval (PENDING_REVIEW) before TTS/cover async pipeline starts.
    human-review-before-narration: ${STORY_HUMAN_REVIEW_BEFORE_NARRATION:false}
  # Library soft-delete: Super Admin delete hides rows for retention-days, then scheduled purge removes them permanently.
  library-story-soft-delete:
    retention-days: ${LIBRARY_STORY_SOFT_DELETE_RETENTION_DAYS:30}
    purge-enabled: ${LIBRARY_STORY_SOFT_DELETE_PURGE_ENABLED:true}
    purge-cron: ${LIBRARY_STORY_SOFT_DELETE_PURGE_CRON:0 0 4 * * *}
  # Optional: reusable structured-output guardrails HTTP service (Python, separate repo). See guardrails-service/README.md
  guardrails-service:
    enabled: ${GUARDRAILS_SERVICE_ENABLED:false}
    base-url: ${GUARDRAILS_SERVICE_URL:}
    api-key: ${GUARDRAILS_SERVICE_API_KEY:}
    connect-timeout-ms: ${GUARDRAILS_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${GUARDRAILS_SERVICE_READ_TIMEOUT_MS:15000}
    fail-open-on-error: ${GUARDRAILS_SERVICE_FAIL_OPEN:false}
  control-plane:
    # Agentic SDLC spine: parent story generation registers workflow runs (Flyway V75+V76). Set false for tests or if seed not applied.
    story-workflow-integration-enabled: ${TAMIXA_CONTROL_PLANE_STORY_WORKFLOW:true}
    story-project-code: ${TAMIXA_CONTROL_PLANE_STORY_PROJECT_CODE:tamixa}
    story-workflow-key: ${TAMIXA_CONTROL_PLANE_STORY_WORKFLOW_KEY:story.create_with_narration}
  # AI cost protection: token limits
  ai-token-limits:
    per-parent-daily: ${AI_TOKEN_LIMIT_PER_PARENT_DAILY:50000}
    system-wide-daily: ${AI_TOKEN_LIMIT_SYSTEM_DAILY:500000}
    circuit-breaker-spike-threshold: ${AI_CIRCUIT_BREAKER_SPIKE_THRESHOLD:100000}
  translation:
    # openai | gemini = real translation via LLM; simulated = dev-only prefix [lang]
    provider: ${TRANSLATION_PROVIDER:simulated}
  # Curated library ops flow (recommended): raw draft → AI rephrase/edit (TA) → Run pipeline (translate+rewrite
  # scripts only, no TTS) with audio-after-approval=true → Submit for review → Approve narration → Generate audio.
  # See docs/ARCHITECTURE_AND_FLOWS.md §9.
  translation-pipeline:
    source-language: ${TRANSLATION_SOURCE_LANGUAGE:ta}  # Skip translation when target == source
    target-languages: ${TRANSLATION_TARGET_LANGUAGES:en,hi,te,kn,ml}  # comma-separated, parsed as list
    # Tamil (source) skips translation; other languages need longer for translate+rewrite+TTS
    translation-timeout-ms: ${TRANSLATION_TIMEOUT_MS:60000}
    tts-timeout-ms: ${TTS_TIMEOUT_MS:90000}
    max-retries: ${TRANSLATION_PIPELINE_MAX_RETRIES:3}
    cache-ttl-hours: ${TRANSLATION_CACHE_TTL_HOURS:24}
    parallelism: ${TRANSLATION_PIPELINE_PARALLELISM:5}
    simulated-delay-ms: ${TRANSLATION_SIMULATED_DELAY_MS:200}
    # Per-language timeout (minutes). If a language exceeds this, it is marked failed and others continue.
    language-timeout-minutes: ${TRANSLATION_LANGUAGE_TIMEOUT_MINUTES:5}
    # Total pipeline timeout (minutes) when processing all languages in parallel. Increase if languages frequently hit "Cancelled after total timeout" (e.g. 60–90 for 6 langs under load).
    total-timeout-minutes: ${TRANSLATION_PIPELINE_TOTAL_TIMEOUT_MINUTES:60}
    # When true (default): publish/update does not auto-trigger the library pipeline (legacy off). Submit for review queues the story; translate/TTS are started explicitly (Generate translations / Generate audio) when audio-after-approval is true.
    pipeline-on-submit-only: ${PIPELINE_ON_SUBMIT_ONLY:true}
    # When true (default): Submit for review does not run translate/TTS; use Generate translations on story edit first, then Submit for review. When false: legacy full pipeline can run on submit.
    audio-after-approval: ${AUDIO_AFTER_APPROVAL:true}
    # When false (default): Approve does not start TTS — use Narration (Story to Speech) → Generate audio. When true: Approve kicks off background TTS when audio is still missing.
    auto-tts-on-approve: ${AUTO_TTS_ON_APPROVE:false}
    # TTS thread pool size (was 1). Increase to 4 for ~4x faster multi-story throughput. Must stay <= app.narration.max-concurrent-tts.
    tts-pool-size: ${TRANSLATION_PIPELINE_TTS_POOL_SIZE:4}
    # Rewrite step timeout (minutes). Prevents indefinite hang when OpenAI is slow. Fails to REWRITE_FAILED, retries.
    rewrite-timeout-minutes: ${TRANSLATION_PIPELINE_REWRITE_TIMEOUT_MINUTES:1}
    # Max minutes a pipeline claim blocks retries. After this, Run pipeline can take over (no Clear stuck needed).
    claim-max-age-minutes: ${TRANSLATION_PIPELINE_CLAIM_MAX_AGE_MINUTES:5}
    # When true: metadata-only edits on published stories keep narration approval. Source/translation text edits still clear approval.
    keep-narration-approval-on-metadata-only-published-update: ${KEEP_NARRATION_APPROVAL_ON_METADATA_ONLY_PUBLISHED_UPDATE:false}
    # When true: TTS only for library_stories.language; playback + parent library + categories + admin pipeline status treat other locales as using master audio.
    master-only-narration: ${TRANSLATION_MASTER_ONLY_NARRATION:false}
  digital-survival-dev:
    rewrite-interactive-graph-audio-to-dev-placeholder: ${DIGITAL_SURVIVAL_DEV_REWRITE_GRAPH:false}
    allow-prepare-e2e-seed-endpoint: ${DIGITAL_SURVIVAL_DEV_PREPARE_E2E:false}
  audio:
    base-url: ${AUDIO_BASE_URL:/audio}
    simulated-tts-delay-ms: ${AUDIO_SIMULATED_TTS_DELAY_MS:500}
    # When CDN disabled, used to build full URLs for stream-url fallback (e.g. http://localhost:8080 for dev, https://api.tamixa.in for prod)
    public-base-url: ${AUDIO_PUBLIC_BASE_URL:http://localhost:8080}
    # Phase 4: optional MP4 URL (https or path under public-base-url); stream-url returns as hostStoryClipUrl (muted in app)
    host-story-clip-url: ${AUDIO_HOST_STORY_CLIP_URL:}
  storage:
    type: ${STORAGE_TYPE:s3}
    # S3_BUCKET: bucket name (e.g. tamixa-audio) OR Access Point ARN (e.g. arn:aws:s3:us-east-1:ACCOUNT:accesspoint/name)
    s3-bucket: ${S3_BUCKET:tamixa-audio}
    s3-region: ${S3_REGION:us-east-1}
  cdn:
    enabled: ${CDN_STREAM_ENABLED:false}
    # Max 10 min per security requirements (S3 presigned URLs)
    signed-url-expiry-minutes: ${CDN_SIGNED_URL_EXPIRY_MINUTES:10}
    cache-ttl-seconds: ${CDN_CACHE_TTL_SECONDS:86400}
  narration:
    # Optional one-switch preset for narration behavior.
    # Values: bedtime | balanced | energetic
    # When set, this preset maps style-profile + modulation-intensity automatically.
    # When empty, manual style-profile/modulation-intensity values are used.
    preset: ${NARRATION_PRESET:}
    # Narration style presets:
    # - default: neutral baseline
    # - kid-energy: slightly faster pace + shorter pauses
    # - bedtime-calm: slightly slower pace + longer pauses
    style-profile: ${NARRATION_STYLE_PROFILE:default}
    # Modulation intensity for SSML emotion prosody and Google speaking-rate shaping:
    # - soft: subtle pitch/rate variation
    # - balanced: default
    # - high: stronger expressive variation
    # Suggested combinations:
    # - bedtime-calm + soft   -> soothing sleep stories
    # - default + balanced    -> general daily listening
    # - kid-energy + high     -> lively daytime stories
    modulation-intensity: ${NARRATION_MODULATION_INTENSITY:balanced}
    # Regenerate-with-prompt quality floor: if rewritten content is shorter than this,
    # admin regenerate flow runs expansion passes to restore medium-form narration.
    regenerate-min-words: ${NARRATION_REGENERATE_MIN_WORDS:900}
    # TTS provider: tamixa | google | openai | sample | simulated. tamixa/sample = SAME pre-recorded audio for ALL stories (no story narration). For story-specific narration use google (or openai). Set NARRATION_TTS_PROVIDER=google and GOOGLE_CLOUD_TTS_API_KEY.
    tts-provider: ${NARRATION_TTS_PROVIDER:tamixa}
    # Tamixa TTS (provider=sample): dir with ta.mp3, hi.mp3, en.mp3 etc. classpath:tts-samples or file:/path/to/samples
    tamixa-tts-dir: ${NARRATION_TAMIXA_TTS_DIR:classpath:tts-samples}
    # Optional: single MP3 used for all languages (e.g. file:/path/to/tamixa.mp3 or classpath:tts-samples/tamixa.mp3). When set, overrides per-language files.
    tamixa-tts-default-file: ${NARRATION_TAMIXA_TTS_DEFAULT_FILE:}
    tamixa-tts-fallback: ${NARRATION_TAMIXA_TTS_FALLBACK:en}
    openai-tts-model: ${NARRATION_OPENAI_TTS_MODEL:tts-1-hd}
    # Speed 1.0 = normal pace (range 0.25-4.0). Use 0.95 for slower bedtime feel.
    openai-tts-speed: ${NARRATION_OPENAI_TTS_SPEED:1.0}
    # Google Cloud TTS: Chirp 3 HD model for high-quality, natural narration. Requires Text-to-Speech API enabled.
    google-tts-api-key: ${GOOGLE_CLOUD_TTS_API_KEY:}
    # Per-chunk HTTP read timeout for Google TTS (full story = multiple chunks; Chirp3/WaveNet can be slow)
    google-tts-read-timeout-seconds: ${GOOGLE_TTS_READ_TIMEOUT_SECONDS:120}
    # Chirp 3 HD voice name. Options: Achernar, Leda, Kore, Pulcherrima, Gacrux (female); Charon, Orus, Achird, Schedar, Rasalgethi (male). See https://cloud.google.com/text-to-speech/docs/chirp3-hd
    google-tts-voice-name: ${NARRATION_GOOGLE_TTS_VOICE_NAME:Achernar}
    # Optional per-language voice override map (lang=voiceName, comma-separated).
    # Example: ta-IN=ta-IN-Wavenet-A,te-IN=te-IN-Standard-A,en-IN=en-IN-Chirp3-HD-Leda
    google-tts-voice-overrides: ${NARRATION_GOOGLE_TTS_VOICE_OVERRIDES:}
    # Use WaveNet for Indic (ta, hi, te, kn, ml, bn). WaveNet trained on native speakers; often sounds more natural than Chirp3 for Indian languages. Set false to use Chirp3-HD.
    google-tts-use-wavenet-for-indic: ${NARRATION_GOOGLE_TTS_USE_WAVENET_FOR_INDIC:true}
    # Speed 1.0 = default. Use 0.92-0.95 for Indic languages—slightly slower helps natural rhythm and native-like emphasis.
    google-tts-speed: ${NARRATION_GOOGLE_TTS_SPEED:0.95}
    # Audio: MP3 = valid playable files for S3/CDN. LINEAR16 requires transcoding (S3 adapter only transcodes WAV).
    # Use MP3 to ensure players get valid audio; LINEAR16 uploaded as .mp3 causes truncation/playback failure.
    google-tts-audio-encoding: ${NARRATION_GOOGLE_TTS_AUDIO_ENCODING:MP3}
    google-tts-sample-rate-hertz: ${NARRATION_GOOGLE_TTS_SAMPLE_RATE:44100}
    google-tts-volume-gain-db: ${NARRATION_GOOGLE_TTS_VOLUME_GAIN_DB:0}
    daily-token-limit: ${NARRATION_DAILY_TOKEN_LIMIT:100000}
    # LLM completion token limit for narration rewrite. 16384 for full long stories.
    max-narration-tokens: ${NARRATION_MAX_TOKENS:16384}
    # Rewrite model: gpt-4o follows conversational prompt better than gpt-4o-mini. Use mini for cheaper/faster.
    rewrite-model: ${NARRATION_REWRITE_MODEL:gpt-4o}
    # Rewrite temperature: higher = more varied/creative phrasing (still bounded by app.story.max-words in prompts + clamp).
    rewrite-temperature: ${NARRATION_REWRITE_TEMPERATURE:0.68}
    # Tamil TTS is faster; other languages (en,hi,te,kn,ml) need more time for full-story synthesis (many chunks).
    # Must be >= pipeline language-timeout-minutes when Google TTS used; increase if seeing TTS timeout failures.
    tts-timeout-seconds: ${NARRATION_TTS_TIMEOUT:300}
    tts-max-retries: ${NARRATION_TTS_MAX_RETRIES:2}
    voice-profile: ${NARRATION_VOICE_PROFILE:default}
    blocklist-keywords: ${NARRATION_BLOCKLIST:}
    per-segment-tts: ${NARRATION_PER_SEGMENT_TTS:false}
    # Word count tolerance: narration may be shorter/longer by this % vs original (e.g. 35 = 65%-135%). Conversational/Tamil rewrites often shorten.
    word-count-tolerance-percent: ${NARRATION_WORD_COUNT_TOLERANCE_PERCENT:35}
    simulated-tts-delay-ms: ${NARRATION_SIMULATED_TTS_DELAY_MS:0}
    # Concurrency: core=4, max=8, queue=20; TTS limiter max 5 concurrent calls
    async-executor-core-size: ${NARRATION_ASYNC_CORE:4}
    async-executor-max-size: ${NARRATION_ASYNC_MAX:8}
    async-queue-capacity: ${NARRATION_ASYNC_QUEUE:20}
    max-concurrent-jobs: ${NARRATION_MAX_CONCURRENT_JOBS:100}
    max-concurrent-tts: ${NARRATION_MAX_CONCURRENT_TTS:5}  # TTS API rate limit protection
    # Must be >= translation-pipeline.parallelism (default 4) or tasks timeout waiting for rewrite permit
    max-concurrent-rewrite: ${NARRATION_MAX_CONCURRENT_REWRITE:5}  # Match parallelism; lower if OpenAI 429
    # Natural pace: use rate=100% so playback matches Cloud samples. Set false for slower kid-friendly pacing.
    ssml-use-natural-pace: ${NARRATION_SSML_USE_NATURAL_PACE:true}
    # When natural pace is on: add very light prosody for dialogue/conversational (+1–2% pitch) to sound warmer. Set false for flat delivery.
    ssml-subtle-prosody-in-natural: ${NARRATION_SSML_SUBTLE_PROSDY_IN_NATURAL:true}
  voice:
    encryption-key: ${VOICE_ENCRYPTION_KEY:}
    max-file-size-bytes: 10485760
  # Cloned-voice story narration: Google Chirp 3 primary, optional ElevenLabs / Fish Audio fallback.
  # ElevenLabs: ELEVENLABS_API_KEY — https://elevenlabs.io/app/settings/api-keys
  # Fish Audio (ElevenLabs alternative): FISH_AUDIO_API_KEY — https://fish.audio/app/api-keys/
  # Tamil (ta) requires a managed cloned-voice provider (Google, ElevenLabs, or Fish Audio); XTTS does not support Tamil.
  voice-cloning:
    enabled: ${VOICE_CLONING_ENABLED:false}
    provider: ${VOICE_CLONING_PROVIDER:google}
    # Production recommendation: Google Chirp 3 primary + ElevenLabs fallback.
    allow-eleven-labs-fallback: ${VOICE_CLONING_ALLOW_ELEVENLABS_FALLBACK:true}
    # When primary is Google: allow Fish Audio for reference-only jobs / fallback if EL is not used (see backend docs).
    allow-fish-audio-fallback: ${VOICE_CLONING_ALLOW_FISH_AUDIO_FALLBACK:false}
    google-cloud-api-key: ${GOOGLE_CLOUD_TTS_API_KEY:}
    eleven-labs-api-key: ${ELEVENLABS_API_KEY:}
    eleven-labs-base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
    fish-audio-api-key: ${FISH_AUDIO_API_KEY:}
    fish-audio-base-url: ${FISH_AUDIO_BASE_URL:https://api.fish.audio}
    fish-audio-tts-model: ${FISH_AUDIO_TTS_MODEL:s2-pro}
    # Default localhost:9000 when backend runs on host. Use 10.0.2.2:9000 only when backend runs inside Android emulator (emulator's alias for host).
    xtts-base-url: ${XTTS_BASE_URL:http://localhost:9000}
    # Read timeout for XTTS /synthesize (seconds). Full-story cloned synthesis can take 5–30+ min; increase if you see "Read timed out".
    xtts-timeout-seconds: ${XTTS_TIMEOUT_SECONDS:1800}
  subscription:
    free-stories-per-month: ${SUBSCRIPTION_FREE_STORIES_PER_MONTH:5}
    starter-stories-per-month: ${SUBSCRIPTION_STARTER_STORIES_PER_MONTH:15}
    free-voice-generations-per-month: ${SUBSCRIPTION_FREE_VOICE_GENERATIONS_PER_MONTH:5}
    trial-days: ${SUBSCRIPTION_TRIAL_DAYS:7}
    grace-period-days: ${SUBSCRIPTION_GRACE_PERIOD_DAYS:3}
    # Optional: encrypt webhook payloads at rest (base64 32-byte AES key). In production, set to true and set SUBSCRIPTION_WEBHOOK_ENCRYPTION_KEY (PCI/compliance).
    webhook-payload-encryption-key: ${SUBSCRIPTION_WEBHOOK_ENCRYPTION_KEY:}
    require-webhook-payload-encryption: ${SUBSCRIPTION_REQUIRE_WEBHOOK_ENCRYPTION:false}
    grace-period-cron: ${SUBSCRIPTION_GRACE_PERIOD_CRON:0 0 2 * * ?}
    trial-expiry-cron: ${SUBSCRIPTION_TRIAL_EXPIRY_CRON:0 0 3 * * ?}
    revenue-snapshot-cron: ${SUBSCRIPTION_REVENUE_SNAPSHOT_CRON:0 0 4 * * ?}
    reconciliation-cron: ${SUBSCRIPTION_RECONCILIATION_CRON:0 0 5 * * ?}
    stripe:
      enabled: ${STRIPE_ENABLED:false}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
      success-url-prefix: ${STRIPE_SUCCESS_URL_PREFIX:https://app.tamixa.com/subscription}
      voice-premium-price-id: ${STRIPE_VOICE_PREMIUM_PRICE_ID:}
    zoho:
      enabled: ${ZOHO_ENABLED:false}
      account-id: ${ZOHO_ACCOUNT_ID:}
      webhook-signing-key: ${ZOHO_WEBHOOK_SIGNING_KEY:}
  avatar-video:
    enabled: ${AVATAR_VIDEO_ENABLED:false}
    provider: ${AVATAR_VIDEO_PROVIDER:sadtalker}
    heygen-api-key: ${HEYGEN_API_KEY:}
    replicate-api-token: ${REPLICATE_API_TOKEN:}
    replicate-model-version: ${AVATAR_VIDEO_MODEL_VERSION:cjwbw/sadtalker:a519cc0cfebaaeade068b23899165a11ec76aaa1d2b313d40d214f204ec957a3}
    gooey-api-key: ${GOOEY_API_KEY:}
    gooey-recipe-id: ${GOOEY_RECIPE_ID:}
    gooey-tts-provider: ${GOOEY_TTS_PROVIDER:ELEVEN_LABS}
    gooey-base-url: ${GOOEY_BASE_URL:https://api.gooey.ai}
    did-api-key: ${DID_API_KEY:}
    did-base-url: ${DID_BASE_URL:https://api.d-id.com}
    poll-interval-seconds: ${AVATAR_VIDEO_POLL_INTERVAL:20}
    max-poll-attempts: ${AVATAR_VIDEO_MAX_POLL:30}
    connect-timeout-ms: ${AVATAR_VIDEO_CONNECT_TIMEOUT:30000}
    read-timeout-ms: ${AVATAR_VIDEO_READ_TIMEOUT:120000}
  share-clip:
    enabled: ${SHARE_CLIP_ENABLED:true}
    clips-per-month-premium-plus: ${SHARE_CLIP_CLIPS_PER_MONTH:10}
    share-base-url: ${SHARE_BASE_URL:https://tamixa.com}
    ffmpeg-enabled: ${SHARE_CLIP_FFMPEG_ENABLED:false}
  export:
    expiry-days: ${EXPORT_EXPIRY_DAYS:7}
    signed-url-expiry-minutes: ${EXPORT_SIGNED_URL_EXPIRY_MINUTES:60}
    process-cron: ${EXPORT_PROCESS_CRON:0 */2 * * * *}
    story-page-size: ${EXPORT_STORY_PAGE_SIZE:200}
    consent-page-size: ${EXPORT_CONSENT_PAGE_SIZE:100}
  bulk-job:
    # When true, use Redis for bulk job state (multi-instance). Requires Redis. Default false.
    use-redis: ${BULK_JOB_USE_REDIS:false}
  push:
    # FCM (Android): Server key from Firebase Console > Project Settings > Cloud Messaging
    fcm-server-key: ${FCM_SERVER_KEY:}
    # APNs: enable only when credentials are real; placeholder keys in YAML still "exist" and would otherwise activate the bean and fail at startup.
    apns-enabled: ${APNS_ENABLED:false}
    # APNs (iOS): Key ID, Team ID, and .p8 key file path from Apple Developer
    apns-key-id: ${APNS_KEY_ID:}
    apns-team-id: ${APNS_TEAM_ID:}
    apns-key-path: ${APNS_KEY_PATH:}
    apns-bundle-id: ${APNS_BUNDLE_ID:com.tamixa.app}
    apns-production: ${APNS_PRODUCTION:false}
