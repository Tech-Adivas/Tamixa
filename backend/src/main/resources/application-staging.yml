# Staging profile: mirrors prod with relaxed logging and dev-like DB defaults where safe.
management:
  endpoint:
    health:
      group:
        readiness:
          include: db,redis,diskSpace

spring:
  flyway:
    # Match production strategy: app nodes do not migrate by default.
    enabled: ${FLYWAY_ENABLED:false}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    # Staging default: Railway Postgres public proxy (override with DATABASE_URL in Railway env).
    # Credentials must come from env (DATABASE_USERNAME / DATABASE_PASSWORD or PGUSER / PGPASSWORD).
    url: ${DATABASE_URL:jdbc:postgresql://crossover.proxy.rlwy.net:58777/${POSTGRES_DB:${PGDATABASE:railway}}?sslmode=require}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:kXAeRTcnqRjZYqdtxTmfMqjNMTTzBigI}}}
    hikari:
      maximum-pool-size: 10

logging:
  level:
    root: WARN
    com.tamixa: INFO
