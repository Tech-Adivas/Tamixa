# Staging profile: mirrors prod with relaxed logging and dev-like DB defaults where safe.
management:
  endpoint:
    health:
      group:
        readiness:
          include: db,redis,diskSpace

spring:
  flyway:
    # Match production strategy: app nodes do not migrate by default.
    enabled: ${FLYWAY_ENABLED:false}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    # Staging default: Railway private Postgres (same project). Override with DATABASE_URL for public proxy or other hosts.
    # Credentials must come from env (DATABASE_USERNAME / DATABASE_PASSWORD or PGUSER / PGPASSWORD).
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:${PGHOST:postgres.railway.internal}}:${POSTGRES_PORT:${PGPORT:5432}}/${POSTGRES_DB:${PGDATABASE:railway}}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:}}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}

logging:
  level:
    root: WARN
    com.tamixa: INFO
