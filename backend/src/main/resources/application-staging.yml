# Staging profile: mirrors prod with relaxed logging and dev-like DB defaults where safe.
management:
  endpoint:
    health:
      group:
        readiness:
          include: db,redis,diskSpace

spring:
  flyway:
    # Match production strategy: app nodes do not migrate by default.
    enabled: ${FLYWAY_ENABLED:false}
  jpa:
    # When the pool cannot connect yet, Hibernate still needs a dialect (metadata lookup would fail otherwise).
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    # Same resolution as dev/prod: DATABASE_URL (JDBC) → POSTGRES_* / PG* chain.
    # DATABASE_PUBLIC_URL (postgresql://...) is applied by PostgresqlUrlEnvironmentPostProcessor when DATABASE_URL is unset.
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:${PGHOST:localhost}}:${POSTGRES_PORT:${PGPORT:5432}}/${POSTGRES_DB:${PGDATABASE:araro_kids}}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:}}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}

logging:
  level:
    root: WARN
    com.tamixa: INFO
    # Hibernate still recommends dropping explicit dialect; we keep it so failed first-connect does not cascade into dialect errors.
    org.hibernate.orm.deprecation: ERROR

app:
  cors:
    # Staging: Railway + local browsers unless overridden. Use CORS_ALLOWED_ORIGINS for exact prod-like allowlists.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://*.up.railway.app,https://*.railway.app}
