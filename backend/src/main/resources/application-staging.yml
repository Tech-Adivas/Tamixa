# Staging profile: mirrors prod with relaxed logging and dev-like DB defaults where safe.
management:
  endpoint:
    health:
      group:
        readiness:
          include: db,redis,diskSpace

spring:
  flyway:
    # Match production strategy: app nodes do not migrate by default.
    enabled: ${FLYWAY_ENABLED:false}
  jpa:
    # When the pool cannot connect yet, Hibernate still needs a dialect (metadata lookup would fail otherwise).
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    # Require an explicit Railway (or other) URL — no baked-in proxy host. Reference Postgres DATABASE_PUBLIC_URL and/or DATABASE_URL on the service.
    url: ${DATABASE_PUBLIC_URL:${DATABASE_URL:}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:}}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: ${HIKARI_MINIMUM_IDLE:2}

logging:
  level:
    root: WARN
    com.tamixa: INFO
    # Hibernate still recommends dropping explicit dialect; we keep it so failed first-connect does not cascade into dialect errors.
    org.hibernate.orm.deprecation: ERROR
