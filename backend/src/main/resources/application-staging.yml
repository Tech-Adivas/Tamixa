# Staging profile: mirrors prod with relaxed logging and dev-like DB defaults where safe.
management:
  endpoint:
    health:
      group:
        readiness:
          include: db,redis,diskSpace

spring:
  flyway:
    # Match production strategy: app nodes do not migrate by default.
    enabled: ${FLYWAY_ENABLED:false}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    # Keep staging aligned with dev precedence and container deployments.
    # Prefer DATABASE_*; fallback to POSTGRES_* when DATABASE_* is not provided.
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:araro_kids}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: 10

logging:
  level:
    root: WARN
    com.tamixa: INFO
