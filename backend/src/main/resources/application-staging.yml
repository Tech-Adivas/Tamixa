# Staging profile: mirrors prod with relaxed logging and dev-like DB defaults where safe.
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/araro_kids}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10

logging:
  level:
    root: WARN
    com.araro: INFO
