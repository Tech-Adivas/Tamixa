# Production overrides. REQUIRED: CORS_ALLOWED_ORIGINS, JWT_SECRET, DATABASE_*
# Storage: S3 default. Set S3_BUCKET, S3_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# When using Stripe: set SUBSCRIPTION_WEBHOOK_ENCRYPTION_KEY (32-byte Base64) so webhook payloads are encrypted at rest (PCI/compliance).

app:
  subscription:
    require-webhook-payload-encryption: true

spring:
  flyway:
    # For horizontally scaled prod, disable on app pods by default and
    # run one dedicated migration job with FLYWAY_ENABLED=true.
    enabled: ${FLYWAY_ENABLED:false}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.tamixa: ${LOG_LEVEL_COM_TAMIXA:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
