spring:
  datasource:
    # Prod default: Railway private Postgres (same project). Override with DATABASE_URL for public proxy or other hosts.
    # Credentials must come from env only — never commit real passwords.
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:${PGHOST:postgres.railway.internal}}:${POSTGRES_PORT:${PGPORT:5432}}/${POSTGRES_DB:${PGDATABASE:railway}}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:}}}
    hikari:
      # Scale with instance count × pool ≤ DB max_connections (leave headroom for migrations, console).
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:5}

management:
  endpoint:
    health:
      group:
        readiness:
          include: db,redis,diskSpace

app:
  openai:
    # Production: require moderation API unless explicitly disabled (never ship without a key in prod).
    moderation-required: ${OPENAI_MODERATION_REQUIRED:true}
  rate-limit:
    # Multi-instance prod: use Redis for distributed rate limiting.
    # Requires Redis (REDIS_HOST / REDIS_PORT). Overrides the default false in application.yml.
    use-redis: ${RATE_LIMIT_USE_REDIS:true}
    # Fail closed when Redis is unavailable so abuse cannot bypass limits.
    redis-fail-open: ${RATE_LIMIT_REDIS_FAIL_OPEN:false}
  bulk-job:
    # Multi-instance prod: use Redis for bulk job state.
    # Requires Redis. Overrides the default false in application.yml.
    use-redis: ${BULK_JOB_USE_REDIS:true}
