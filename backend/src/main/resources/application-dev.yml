# Dev: seed admin via POST /api/v1/dev/seed-admin. Override with env SEED_ADMIN_ENABLED=false to disable.
SEED_ADMIN_ENABLED: "true"

# Dev OTP bypass: use code "123456" with any phone to log in without SMS
# Dev passwordless: use code "123456" for web app login with any email (no email send needed)
# Narration: longer TTS timeout for dev
app:
  digital-survival-dev:
    # After Flyway V86–V90, POST /api/v1/dev/digital-survival/prepare-e2e-seed (no auth) then open mobile Library → Practice (language=en).
    rewrite-interactive-graph-audio-to-dev-placeholder: true
    allow-prepare-e2e-seed-endpoint: true
  auth:
    dev-otp-code: ${DEV_OTP_CODE:123456}
    dev-passwordless-code: ${DEV_PASSWORDLESS_CODE:123456}
  cors:
    # Dev: explicit localhost admin/web ports (override with CORS_ALLOWED_ORIGINS / CORS_ALLOWED_ORIGIN_PATTERNS).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
spring:
  jpa:
    # Align with staging/prod when JDBC metadata is slow or unavailable at startup.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false  # Use org.hibernate.SQL logger instead (show-sql writes to stdout separately = duplicate logs)
    hibernate:
      ddl-auto: update
  datasource:
    # Same URL pattern as staging/prod. Precedence: DATABASE_URL (JDBC) → POSTGRES_* / PG* defaults.
    # Off Railway, dev profile ignores Railway public proxy URLs and redirects JDBC to dev.db.tamixa.in (ssl) unless PGHOST/POSTGRES_HOST or TAMIXA_DEV_POSTGRES_HOST overrides; set TAMIXA_USE_REMOTE_DATABASE=true to force the Railway URL from your laptop.
    # If DATABASE_URL is unset, DATABASE_PUBLIC_URL (postgresql://...) is promoted to JDBC by PostgresqlUrlEnvironmentPostProcessor.
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:${PGHOST:localhost}}:${POSTGRES_PORT:${PGPORT:5432}}/${POSTGRES_DB:${PGDATABASE:araro_kids}}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:${PGUSER:postgres}}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:${PGPASSWORD:postgres}}}
    hikari:
      maximum-pool-size: 20

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.tamixa: ${LOG_LEVEL_COM_TAMIXA:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN
    # INFO so PIPELINE >>> and RequestLoggingFilter stand out; set LOG_LEVEL_SPRING_WEB=DEBUG for Spring verbosity
    org.springframework.web: ${LOG_LEVEL_SPRING_WEB:INFO}
