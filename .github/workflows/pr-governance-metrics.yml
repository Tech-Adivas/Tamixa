# Parses optional AI SDLC fields from the PR body into the job summary + JSON artifact.
name: PR governance metrics

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gov-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write PR body to file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync('pr-body.txt', context.payload.pull_request.body || '');

      - name: Parse PR body
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GOVERNANCE_JSON: pr-governance.json
        run: python3 .github/scripts/parse_pr_governance.py < pr-body.txt

      - name: Upload governance JSON
        uses: actions/upload-artifact@v4
        with:
          name: pr-governance-${{ github.event.pull_request.number }}
          path: pr-governance.json
          if-no-files-found: error
