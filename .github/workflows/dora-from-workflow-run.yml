name: DORA from workflow run

on:
  workflow_run:
    # Add real deploy workflow names here (exact workflow "name" field values).
    workflows:
      - "Deploy backend (example)"
    types: [completed]

permissions:
  contents: read

jobs:
  report-deployment-from-workflow:
    runs-on: ubuntu-latest
    env:
      DORA_API_BASE_URL: ${{ secrets.DORA_API_BASE_URL }}
      DORA_ADMIN_BEARER_TOKEN: ${{ secrets.DORA_ADMIN_BEARER_TOKEN }}
      DORA_DEFAULT_ENVIRONMENT: ${{ vars.DORA_DEFAULT_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v6

      - name: Decide if workflow should emit DORA deployment
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            const workflowName = context.payload.workflow_run?.name || "";
            const conclusion = context.payload.workflow_run?.conclusion || "";
            const headSha = context.payload.workflow_run?.head_sha || "";
            const runId = context.payload.workflow_run?.id || "";
            const htmlUrl = context.payload.workflow_run?.html_url || "";
            const branch = context.payload.workflow_run?.head_branch || "";

            const shouldReport = workflowName === "Deploy backend (example)";
            const status = conclusion === "success" ? "SUCCESS" : "FAILED";
            const isFinal = ["success", "failure", "timed_out", "cancelled"].includes(conclusion);
            const finalShouldReport = shouldReport && isFinal;
            const environment = (process.env.DORA_DEFAULT_ENVIRONMENT || "production").trim() || "production";
            const summary = `workflow=${workflowName}, conclusion=${conclusion}, branch=${branch}, runId=${runId}, url=${htmlUrl}`;

            core.info(`workflowName=${workflowName}`);
            core.info(`conclusion=${conclusion}`);
            core.setOutput("should_report", finalShouldReport ? "true" : "false");
            core.setOutput("status", status);
            core.setOutput("change_id", headSha);
            core.setOutput("environment", environment);
            core.setOutput("summary", summary);

      - name: Validate DORA secrets for reporting
        if: ${{ steps.decide.outputs.should_report == 'true' }}
        run: |
          if [ -z "${DORA_API_BASE_URL:-}" ]; then
            echo "Missing required secret DORA_API_BASE_URL"
            exit 1
          fi
          if [ -z "${DORA_ADMIN_BEARER_TOKEN:-}" ]; then
            echo "Missing required secret DORA_ADMIN_BEARER_TOKEN"
            exit 1
          fi

      - name: Report deployment DORA event
        if: ${{ steps.decide.outputs.should_report == 'true' }}
        run: |
          scripts/report-dora-event.sh deployment \
            --status "${{ steps.decide.outputs.status }}" \
            --service "backend" \
            --environment "${{ steps.decide.outputs.environment }}" \
            --change-id "${{ steps.decide.outputs.change_id }}" \
            --summary "${{ steps.decide.outputs.summary }}"
