# Ensures the Gradle wrapper JAR was not tampered with (supply-chain hygiene).
name: Validate Gradle Wrapper

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Mitigate ENETUNREACH on IPv6 when runners cannot reach Cloudflare over IPv6.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - uses: actions/checkout@v4
      # v3+ often timed out fetching checksums; v4 embeds more known checksums. allow-checksums
      # accepts our JARs if the action still needs to verify offline-adjacent paths.
      - uses: gradle/actions/wrapper-validation@v4.4.4
        with:
          min-wrapper-count: "2"
          allow-checksums: b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13
