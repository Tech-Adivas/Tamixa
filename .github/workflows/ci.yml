name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tamixa_kids_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tamixa_kids_test
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
      - name: Guard Flyway migration versions
        run: |
          bash .github/scripts/flyway-duplicate-version-guard.sh
      - name: Build and test backend
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :backend:test -Ptamixa.backendOnly=true --no-daemon -q
          else
            gradle :backend:test -Ptamixa.backendOnly=true --no-daemon
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, lint, test, and build web
        run: |
          cd web
          npm ci 2>/dev/null || npm install
          npm audit --audit-level=critical
          npm run lint
          npm test
          npm run build
      - name: Docker build web (context ./web)
        run: docker build -f web/Dockerfile web --build-arg VITE_API_BASE_URL=http://localhost:8080

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install, lint, test, and build admin
        run: |
          cd admin
          npm ci 2>/dev/null || npm install
          npm audit --audit-level=critical
          npm run lint
          npm test
          npm run build

  story-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: story-pipeline/package-lock.json
      - name: Typecheck and build story-pipeline
        run: |
          cd story-pipeline
          npm ci 2>/dev/null || npm install
          npm run typecheck
          npm run build

  mobile-android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Compile composeApp (devDebug)
        run: |
          chmod +x gradlew
          ./gradlew :mobile:composeApp:compileDevDebugKotlinAndroid --no-daemon
